<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Login | Angeles Inn</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F4F4F5;
      color: #18181B;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .login-card {
      width: min(92vw, 420px);
      background: #fff;
      border: 1px solid #E4E4E7;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 18px 42px rgba(0,0,0,.08);
    }
    .brand-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #18181B;
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      margin: 0 auto 16px;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #71717A;
      margin-bottom: 22px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #71717A;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #D4D4D8;
      font-size: 15px;
      background: #FAFAFA;
    }
    input:focus {
      outline: 3px solid rgba(5,150,105,.14);
      border-color: #059669;
    }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: #18181B;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">AI</div>
    <h1>Angeles Inn</h1>
    <div class="subtitle">Owner Portal</div>

    <div id="login-error" class="error" role="alert">Invalid email or password.</div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Owner Email</label>
        <input type="email" id="email" required placeholder="owner@angelesinn.ph" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password" />
      </div>

      <button type="submit" class="btn">Access Bed-Space Tracker</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "angeles-transient-inn.firebaseapp.com",
      projectId: "angeles-transient-inn",
      storageBucket: "angeles-transient-inn.appspot.com",
      messagingSenderId: "PASTE_YOUR_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } catch (error) {
        loginError.classList.add('show');
      }
    });
  </script>
</body>
</html>
