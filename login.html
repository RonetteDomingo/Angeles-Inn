<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Login | Angeles Inn Bed-Space Tracker</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-zinc-950 text-zinc-900 antialiased">

  <div class="w-full max-w-md bg-white rounded-3xl p-7 sm:p-10 shadow-2xl space-y-6 fade-in">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-zinc-900 text-white flex items-center justify-center">
        <i data-lucide="bed-double" class="w-5 h-5"></i>
      </div>
      <div>
        <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">
          Owner Portal Only
        </span>
        <h1 class="text-xl font-bold tracking-tight mt-0.5">Angeles Inn</h1>
      </div>
    </div>

    <p class="text-xs sm:text-sm text-zinc-500 leading-relaxed">
      Internal bed-space availability tracker and tenant rent monitor. Authorized management access only.
    </p>

    <div id="login-error" class="hidden flex items-center gap-2 p-3 text-xs sm:text-sm text-red-700 bg-red-50 border border-red-100 rounded-xl">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span>Invalid owner credentials.</span>
    </div>

    <form id="login-form" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Owner Username / Email</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
          <input
            type="text"
            id="email"
            required
            placeholder="owner@angelesinn.ph"
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 transition"
          />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 transition"
          />
        </div>
      </div>

      <button
        type="submit"
        class="w-full flex items-center justify-center gap-2 bg-zinc-900 hover:bg-zinc-800 active:scale-[0.99] text-white font-medium py-3.5 rounded-xl text-sm transition cursor-pointer"
      >
        <span>Access Bed-Space Tracker</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="pt-4 border-t border-zinc-100 text-xs text-zinc-400">
      <p>Default Owner Login: <span class="text-zinc-700 font-semibold">owner@angelesinn.ph</span> / <span class="text-zinc-700 font-semibold">angeles2026</span></p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
