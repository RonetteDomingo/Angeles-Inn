<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Login | Angeles Inn Bed-Space Tracker</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-zinc-950 text-zinc-900 antialiased">

  <div class="w-full max-w-md bg-white rounded-3xl p-7 sm:p-10 shadow-2xl space-y-6">
    <div>
      <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md">
        Owner Portal Only
      </span>
      <h1 class="text-2xl font-bold tracking-tight mt-2">Angeles Inn</h1>
      <p class="text-xs sm:text-sm text-zinc-500 mt-1">
        Internal bed-space availability tracker and tenant rent monitor.
      </p>
    </div>

    <div id="login-error" class="hidden p-3 text-xs sm:text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl font-medium">
      Invalid email or password. Use owner@angelesinn.ph / angeles2026
    </div>

    <form id="login-form" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Owner Email</label>
        <input
          type="text"
          id="email"
          required
          value="owner@angelesinn.ph"
          class="w-full px-4 py-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Password</label>
        <input
          type="password"
          id="password"
          required
          placeholder="angeles2026"
          class="w-full px-4 py-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 transition"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-3.5 rounded-xl text-sm transition cursor-pointer"
      >
        Access Bed-Space Tracker →
      </button>
    </form>

    <div class="pt-4 border-t border-zinc-100 text-xs text-zinc-400">
      <p>Login: <strong class="text-zinc-700">owner@angelesinn.ph</strong> | Password: <strong class="text-zinc-700">angeles2026</strong></p>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('angeles_owner')) {
      window.location.replace('index.html');
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value.trim();

      if (email === 'owner@angelesinn.ph' && password === 'angeles2026') {
        sessionStorage.setItem('angeles_owner', JSON.stringify({ email: email, name: 'Angeles Inn Owner' }));
        window.location.href = 'index.html';
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
