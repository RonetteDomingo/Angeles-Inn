<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f5" />
  <title>Owner Login | Angeles Inn</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.login-page {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #F4F4F5;
      color: #18181B;
    }

    .login-card {
      width: min(100%, 440px);
      padding: clamp(24px, 6vw, 40px);
      background: #FFF;
      border: 1px solid #E4E4E7;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(24, 24, 27, 0.10);
    }

    .login-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .login-brand .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      font-size: 19px;
    }

    .login-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-heading h1 {
      margin: 12px 0 5px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .login-heading p {
      color: #71717A;
      font-size: 14px;
    }

    .login-tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 99px;
      background: #ECFDF5;
      color: #047857;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .login-error {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid #FECACA;
      border-radius: 12px;
      background: #FEF2F2;
      color: #B91C1C;
      font-size: 13px;
    }

    .login-error.visible {
      display: block;
    }

    .login-form .form-group {
      margin-bottom: 18px;
    }

    .login-form .form-label {
      color: #52525B;
      font-size: 11px;
    }

    .login-form .form-input {
      background: #FAFAFA;
      min-height: 48px;
    }

    .login-form .form-input:focus {
      outline: 3px solid rgba(5, 150, 105, 0.15);
      border-color: #059669;
    }

    .login-submit {
      width: 100%;
      margin-top: 4px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #18181B;
      color: #FFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .login-submit:hover {
      background: #3F3F46;
    }

    .login-submit:active {
      transform: translateY(1px);
    }

    .login-footer {
      padding-top: 18px;
      margin-top: 22px;
      border-top: 1px solid #F4F4F5;
      color: #71717A;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body.login-page {
        padding: 16px;
      }

      .login-card {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-icon" aria-hidden="true">AI</div>
    </div>

    <header class="login-heading">
      <span class="login-tag">Owner Portal</span>
      <h1>Welcome to Angeles Inn</h1>
      <p>Sign in to manage rooms and guest stays.</p>
    </header>

    <div id="login-error" class="login-error" role="alert" aria-live="polite">
      The email or password is incorrect. Please try again.
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Owner email</label>
        <input
          type="email"
          id="email"
          class="form-input"
          required
          autocomplete="username"
          placeholder="owner@angelesinn.ph"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
        />
      </div>

      <button type="submit" class="login-submit">
        Sign in to the portal <span aria-hidden="true">→</span>
      </button>
    </form>

    <footer class="login-footer">
      Angeles Inn · Guest and room management
    </footer>
  </main>

  <script>
    if (sessionStorage.getItem('angeles_owner')) {
      window.location.replace('index.html');
    }

    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;

      if (email === 'owner@angelesinn.ph' && password === 'angeles2026') {
        sessionStorage.setItem('angeles_owner', JSON.stringify({ email: email, name: 'Angeles Inn Owner' }));
        window.location.href = 'index.html';
      } else {
        document.getElementById('login-error').classList.add('visible');
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
