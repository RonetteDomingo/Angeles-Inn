<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angeles Inn | Owner Bed-Space Tracker</title>
  <script>
    if (!sessionStorage.getItem('angeles_owner')) {
      window.location.replace('login.html');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F4F4F5;
      color: #18181B;
      line-height: 1.45;
      padding-bottom: 70px;
    }
    .navbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #E4E4E7;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; background: #18181B; color: #FFF;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .brand-title { font-weight: 700; font-size: 17px; }
    .brand-sub { font-size: 10px; color: #71717A; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .btn-lock {
      background: #F4F4F5; color: #3F3F46; border: 1px solid #E4E4E7;
      padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .room-tabs-bar { background: #FFF; border-bottom: 1px solid #E4E4E7; overflow-x: auto; }
    .room-tabs-inner { max-width: 1100px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 8px; }
    .room-tab {
      padding: 9px 15px; border-radius: 12px; border: none; background: #F4F4F5; color: #52525B;
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .room-tab.active { background: #18181B; color: #FFF; }
    .tab-pill { font-size: 10px; padding: 2px 6px; border-radius: 99px; background: rgba(255,255,255,0.2); }
    .room-tab:not(.active) .tab-pill { background: #E4E4E7; color: #3F3F46; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .overview-room-card {
      background: #FFF; border: 1px solid #E4E4E7; border-radius: 20px; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    }
    .room-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #F4F4F5; color: #3F3F46; }
    .room-badge.male { background: #EFF6FF; color: #1D4ED8; }
    .room-badge.female { background: #FFF1F2; color: #BE123C; }
    .btn-open-room { width: 100%; padding: 11px; border-radius: 12px; border: none; background: #18181B; color: #FFF; font-size: 13px; font-weight: 600; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat-card { background: #FFF; border: 1px solid #E4E4E7; border-radius: 16px; padding: 14px 16px; }
    .stat-card.green { background: #ECFDF5; border-color: #A7F3D0; }
    .stat-card.amber { background: #FFFBEB; border-color: #FDE68A; }
    .stat-label { font-size: 11px; font-weight: 700; color: #71717A; text-transform: uppercase; }
    .stat-card.green .stat-label { color: #065F46; }
    .stat-card.amber .stat-label { color: #92400E; }
    .stat-value { font-size: 24px; font-weight: 800; margin-top: 2px; }
    .stat-card.green .stat-value { color: #047857; }
    .stat-card.amber .stat-value { color: #B45309; }
    .page-header {
      background: #FFF; border: 1px solid #E4E4E7; border-radius: 20px; padding: 18px 20px;
      margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .page-title { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .decks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .bunk-frame {
      position: relative; border-left: 6px solid #3F3F46; border-right: 6px solid #3F3F46;
      border-top: 5px solid #3F3F46; border-radius: 12px 12px 2px 2px; padding: 10px 10px 12px 10px;
      background: #FFF; box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .bunk-frame::before, .bunk-frame::after {
      content: ""; position: absolute; bottom: -9px; width: 6px; height: 9px; background: #3F3F46;
    }
    .bunk-frame::before { left: -6px; }
    .bunk-frame::after { right: -6px; }
    .bunk-frame-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
    .bunk-frame-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #27272A; }
    .bunk-structure { display: flex; gap: 10px; align-items: stretch; }
    .bunk-ladder {
      width: 20px; flex-shrink: 0; border-left: 2.5px solid #71717A; border-right: 2.5px solid #71717A;
      display: flex; flex-direction: column; justify-content: space-evenly; padding: 4px 0;
    }
    .ladder-rung { height: 2.5px; background: #71717A; width: 100%; }
    .bunk-tiers { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .bunk-divider { height: 3px; background: #52525B; border-radius: 2px; }
