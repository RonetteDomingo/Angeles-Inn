<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angeles Inn | Owner Bed-Space Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    if (!sessionStorage.getItem('angeles_owner')) {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <div>
          <div class="brand-title">Angeles Inn</div>
          <div class="brand-sub">Owner Bed-Space Portal</div>
        </div>
      </div>
      <button id="logout-btn" class="btn-lock">Lock Portal</button>
    </div>
    <div class="room-tabs-bar">
      <div class="room-tabs-inner" id="room-tabs"></div>
    </div>
  </nav>

  <main id="app-content" class="container"></main>

  <div id="bunk-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-top">
        <div>
          <div id="modal-room-label" class="brand-sub">Room</div>
          <h3 id="modal-bunk-title" style="font-size:18px;font-weight:700;">Bunkbed 1 Upper</h3>
        </div>
        <button id="close-modal" class="btn-close">✕</button>
      </div>

      <form id="bunk-form">
        <input type="hidden" id="modal-bed-id" />

        <div class="form-group">
          <label class="form-label">Name of Guest</label>
          <input type="text" id="guest-name" class="form-input" required placeholder="e.g. Juan Dela Cruz" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Check-in Date</label>
            <input type="date" id="start-date" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label">Check-out Date</label>
            <input type="date" id="end-date" class="form-input" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Remarks</label>
          <input type="text" id="guest-notes" class="form-input" placeholder="e.g. Paid ₱2,500 / 0917-xxx-xxxx" />
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-save">Save Guest</button>
          <button type="button" id="vacate-btn" class="btn-vacate">Clear Bed</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
