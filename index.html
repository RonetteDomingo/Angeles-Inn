<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angeles Inn | Owner Bed-Space Tracker</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    if (!sessionStorage.getItem('angeles_owner')) {
      window.location.replace('login.html');
    }
  </script>
</head>
<body class="min-h-screen antialiased pb-16">

  <!-- Top Owner Navbar -->
  <nav class="sticky top-0 z-40 glass-nav border-b border-zinc-200/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-zinc-900 text-white flex items-center justify-center">
          <i data-lucide="bed-double" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="font-bold text-base sm:text-lg tracking-tight block leading-none">Angeles Inn</span>
          <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Owner Bed-Space Board</span>
        </div>
      </div>

      <button
        id="logout-btn"
        class="flex items-center gap-1.5 text-xs sm:text-sm font-medium text-zinc-600 hover:text-zinc-900 px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200/70 transition cursor-pointer"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Lock Portal</span>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 space-y-6 fade-in">

    <!-- Live Capacity & Expiration Summary Cards -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
      <div class="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200/80">
        <span class="text-xs font-medium text-zinc-500">Total Capacity</span>
        <div class="mt-1 flex items-baseline gap-2">
          <span class="text-2xl sm:text-3xl font-bold">24</span>
          <span class="text-xs text-zinc-400">bunks (3 rooms)</span>
        </div>
      </div>

      <div class="bg-emerald-50/80 p-4 sm:p-5 rounded-2xl border border-emerald-200/80">
        <span class="text-xs font-semibold text-emerald-800">Available Beds</span>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="stat-vacant" class="text-2xl sm:text-3xl font-bold text-emerald-700">24</span>
          <span class="text-xs text-emerald-700">ready for rent</span>
        </div>
      </div>

      <div class="bg-white p-4 sm:p-5 rounded-2xl border border-zinc-200/80">
        <span class="text-xs font-medium text-zinc-500">Occupied Beds</span>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="stat-occupied" class="text-2xl sm:text-3xl font-bold text-zinc-900">0</span>
          <span class="text-xs text-zinc-400">active tenants</span>
        </div>
      </div>

      <div class="bg-amber-50/80 p-4 sm:p-5 rounded-2xl border border-amber-200/80">
        <span class="text-xs font-semibold text-amber-800">Ending Soon / Overdue</span>
        <div class="mt-1 flex items-baseline gap-2">
          <span id="stat-expiring" class="text-2xl sm:text-3xl font-bold text-amber-700">0</span>
          <span class="text-xs text-amber-700">within 3 days</span>
        </div>
      </div>
    </section>

    <!-- Search & Filter Bar -->
    <section class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between bg-white p-3.5 rounded-2xl border border-zinc-200/80">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3"></i>
        <input
          type="text"
          id="search-guest"
          placeholder="Search tenant name..."
          class="w-full pl-10 pr-4 py-2 rounded-xl bg-zinc-50 border border-zinc-200/80 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900"
        />
      </div>

      <div class="flex gap-2 overflow-x-auto pb-1 sm:pb-0">
        <button data-filter="all" class="filter-btn active px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-900 text-white cursor-pointer shrink-0">All Rooms</button>
        <button data-filter="vacant" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-100 text-zinc-700 hover:bg-zinc-200 cursor-pointer shrink-0">Vacant Only</button>
        <button data-filter="expiring" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-100 text-zinc-700 hover:bg-zinc-200 cursor-pointer shrink-0">Expiring / Overdue</button>
      </div>
    </section>

    <!-- 3 Rooms Container (Rendered by app.js) -->
    <section id="rooms-container" class="grid lg:grid-cols-3 gap-6"></section>

  </main>

  <!-- Modal: Assign / Edit Guest in Bunk -->
  <div id="bunk-modal" class="hidden fixed inset-0 z-50 bg-zinc-950/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl fade-in">
      <div class="flex items-center justify-between border-b border-zinc-100 pb-4">
        <div>
          <span id="modal-room-label" class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Room</span>
          <h3 id="modal-bunk-title" class="text-lg font-bold text-zinc-900">Bunk 1 - Upper</h3>
        </div>
        <button id="close-modal" class="p-2 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-600 cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="bunk-form" class="space-y-4">
        <input type="hidden" id="modal-bed-id" />

        <div class="space-y-1">
          <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Guest / Tenant Full Name</label>
          <input
            type="text"
            id="guest-name"
            required
            placeholder="e.g. Juan Dela Cruz"
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Start Date</label>
            <input
              type="date"
              id="start-date"
              required
              class="w-full px-3 py-2.5 rounded-xl border border-zinc-200 bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900"
            />
          </div>
          <div class="space-y-1">
            <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">End of Rent Date</label>
            <input
              type="date"
              id="end-date"
              required
              class="w-full px-3 py-2.5 rounded-xl border border-zinc-200 bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900"
            />
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Contact / Notes (Optional)</label>
          <input
            type="text"
            id="guest-notes"
            placeholder="0917-xxx-xxxx / Paid ₱2,500"
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900"
          />
        </div>

        <div class="pt-2 flex flex-col sm:flex-row gap-2.5">
          <button
            type="submit"
            class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-white font-medium py-3 rounded-xl text-sm transition cursor-pointer"
          >
            Save Guest to Bunk
          </button>
          <button
            type="button"
            id="vacate-btn"
            class="hidden px-4 py-3 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 font-medium text-sm transition cursor-pointer"
          >
            Clear / Vacate Bed
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
